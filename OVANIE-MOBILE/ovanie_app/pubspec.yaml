publish_to: "none"
version: 1.0.0+92

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  geolocator: 14.0.2
  flutter_map: ^8.2.2
